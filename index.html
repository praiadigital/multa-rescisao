<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multa Rescisão — Calculadora de Distrato | Praia Digital</title><meta name="description" content="Calcule multa rescisória de contrato de locação (Lei do Inquilinato) de forma proporcional e correta."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#f2eefa,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #4a3b6e22}h1{color:#3d3060;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #ded5ef;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#4a3b6e;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#f0ecf8;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#4a3b6e;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/juridico-facil">Jurídico Fácil</a> · <a href="https://praia.digital/gerador-contrato">Gerador de Contrato</a> · <a href="https://praia.digital/taxa-cancelamento">Taxa de Cancelamento</a></nav><div class="card"><h1>⚖️ Multa Rescisão</h1><p>Rescisão antecipada proporcional, conforme a Lei do Inquilinato (art. 4º).</p><label>Aluguel mensal (R$)</label><input id="a" type="number" value="2500"><label>Duração do contrato (meses)</label><input id="t" type="number" value="30"><label>Meses já cumpridos</label><input id="c" type="number" value="12"><label>Multa contratual (nº de aluguéis)</label><select id="m"><option value="3" selected>3 aluguéis (padrão)</option><option value="2">2 aluguéis</option><option value="1">1 aluguel</option></select><button onclick="calc()">Calcular multa</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const a=g('a'),t=g('t'),c=g('c'),m=g('m');const rest=t-c,bruta=a*m,prop=bruta*rest/t;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>📄 Multa cheia: R$ ${bruta.toLocaleString('pt-BR')} (${m} aluguéis)</p><p>⏳ Proporcional pelo tempo restante (${rest}/${t} meses):</p><p style="font-size:1.4rem"><b>R$ ${prop.toLocaleString('pt-BR',{maximumFractionDigits:0})}</b></p><p>ℹ️ A multa deve ser proporcional ao tempo restante (Súmula 52/TJ e entendimento do STJ). Isenções: transferência de emprego para outra cidade (art. 4º, parágrafo único).</p><p>💡 Traduza outras cláusulas no <a href="https://praia.digital/juridico-facil">Jurídico Fácil</a>.</p>`}</script></body></html>
